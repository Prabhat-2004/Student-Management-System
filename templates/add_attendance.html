
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 650px;">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Mark Student Attendance</h3>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Select Student</label>
                    <select name="student" class="form-select" required>
                        <option value="">Choose Student</option>

                        {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.student_id }} - {{ student.first_name }} {{ student.last_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Attendance Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Attendance Status</label>
                    <select name="status" class="form-select" required>
                        <option value="">Choose Status</option>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Attendance
                </button>

                <a href="{% url 'attendance_list' %}" class="btn btn-secondary">
                    View Attendance
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
