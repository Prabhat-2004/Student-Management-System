
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student | Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 550px;">

        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">Delete Student</h3>
        </div>

        <div class="card-body text-center">

            <h5>Are you sure you want to delete this student?</h5>

            <p class="mt-3">
                **Student ID:** {{ student.student_id }}
            </p>

            <p>
                **Name:** {{ student.first_name }} {{ student.last_name }}
            </p>

            <p class="text-danger">
                This action cannot be undone!
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'student_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
