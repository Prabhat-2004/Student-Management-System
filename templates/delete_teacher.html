
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Teacher | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 550px;">
        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">Delete Teacher</h3>
        </div>

        <div class="card-body text-center">
            <h5>Are you sure you want to delete this teacher?</h5>

            <p class="mt-3 mb-1">
                <strong>Teacher ID:</strong> {{ teacher.teacher_id }}
            </p>
            <p>
                <strong>Name:</strong> {{ teacher.first_name }} {{ teacher.last_name }}
            </p>

            <form method="POST" class="mt-4">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
